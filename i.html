<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Images</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f3f5;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    #status {
      text-align: center;
      padding: 15px;
      color: #555;
    }

    #gallery {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      background: #eee;
      border-radius: 8px;
      display: block;
    }

    .filename {
      font-size: 13px;
      margin: 9px 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .download {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #16a34a;
      color: white;
      padding: 10px;
      border-radius: 7px;
      font-weight: bold;
    }

    .download:active {
      transform: scale(0.97);
    }

    .empty {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #777;
    }

    @media (max-width: 500px) {
      #gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px;
      }

      .card img {
        height: 150px;
      }
    }
  </style>
</head>

<body>

<header>
  📷 My Images
</header>

<div id="status">
  Images loading...
</div>

<div id="gallery"></div>

<script>

  // ==============================
  // GITHUB SETTINGS
  // ==============================

  const OWNER = "adidocs";
  const REPO = "Adesh";
  const BRANCH = "main";


  // ==============================
  // IMAGE EXTENSIONS
  // ==============================

  const imageExtensions = [
    ".jpg",
    ".jpeg",
    ".png",
    ".gif",
    ".webp",
    ".bmp",
    ".svg",
    ".avif"
  ];


  // ==============================
  // LOAD ALL FILES FROM GITHUB
  // ==============================

  async function loadImages() {

    const status = document.getElementById("status");
    const gallery = document.getElementById("gallery");

    try {

      const apiURL =
        `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

      const response = await fetch(apiURL);

      if (!response.ok) {
        throw new Error("GitHub API error");
      }

      const data = await response.json();

      const files = data.tree || [];

      const images = files.filter(file => {

        if (file.type !== "blob") {
          return false;
        }

        const name = file.path.toLowerCase();

        return imageExtensions.some(ext =>
          name.endsWith(ext)
        );

      });


      gallery.innerHTML = "";

      if (images.length === 0) {

        status.textContent = "No images found.";

        gallery.innerHTML =
          `<div class="empty">
             📭 No images available
           </div>`;

        return;
      }


      status.textContent =
        `${images.length} image${images.length > 1 ? "s" : ""} found`;


      // ==============================
      // CREATE IMAGE CARDS
      // ==============================

      images.forEach(file => {

        const encodedPath =
          file.path
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");


        const imageURL =
          `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodedPath}`;


        const card =
          document.createElement("div");

        card.className = "card";


        const img =
          document.createElement("img");

        img.src = imageURL;

        img.alt = file.path;

        img.loading = "lazy";


        const filename =
          document.createElement("div");

        filename.className = "filename";

        filename.textContent = file.path;


        const download =
          document.createElement("a");

        download.className = "download";

        download.href = imageURL;

        download.target = "_blank";

        download.rel = "noopener";

        download.textContent = "⬇ Download";


        card.appendChild(img);

        card.appendChild(filename);

        card.appendChild(download);

        gallery.appendChild(card);

      });

    }

    catch (error) {

      console.error(error);

      status.textContent =
        "Images load नहीं हो पाईं।";

      gallery.innerHTML =
        `<div class="empty">
          ❌ GitHub repository check करें।
        </div>`;

    }

  }


  // START
  loadImages();

</script>

</body>
</html>
